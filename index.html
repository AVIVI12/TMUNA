<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Generator</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.loader {
  border: 4px solid #444;
  border-top: 4px solid #fff;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body class="bg-gray-900 text-white min-h-screen flex flex-col">

<div class="p-4 bg-gray-800 flex gap-2">
    <input id="prompt" class="flex-1 p-2 rounded bg-gray-700"
        placeholder="תאר תמונה..." />
    <button onclick="generateImage()" class="bg-purple-600 px-4 rounded">
        צור
    </button>
</div>

<div class="flex flex-col items-center gap-4 p-4">

    <div id="loader" class="hidden loader"></div>

    <img id="result" class="rounded-lg max-h-[500px] shadow-lg" />

</div>

<script>

const WORKER_URL = "https://winter-bonus-9667.yecielashual.workers.dev";

function sleep(ms){
    return new Promise(r => setTimeout(r, ms));
}

let currentId = null;

async function generateImage(){

    const prompt = document.getElementById("prompt").value.trim();
    const img = document.getElementById("result");

    if(!prompt){
        alert("כתוב תיאור");
        return;
    }

    img.src = "";
    document.getElementById("loader").classList.remove("hidden");

    try {

        // 1. יצירה
        const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                version: "39ed52f2a78e934c5e8c7a6d3b5a793b4c5c6d2e5c1b3b3e6c8c4f5c6d7e8f9a",
                input: {
                    prompt: prompt,
                    width: 1024,
                    height: 1024
                }
            })
        });

        const data = await res.json();

        if(!data.id){
            throw new Error("לא התקבל ID מהשרת");
        }

        currentId = data.id;

        // 2. polling
        let status = data.status;

        while(status !== "succeeded" && status !== "failed"){

            await sleep(2000);

            const check = await fetch(`${WORKER_URL}/status?id=${currentId}`);

            const result = await check.json();
            status = result.status;

            if(status === "succeeded"){
                img.src = result.output?.[0] || "";
            }

            if(status === "failed"){
                throw new Error("יצירת תמונה נכשלה");
            }
        }

    } catch (err){
        alert("❌ " + err.message);
    }

    document.getElementById("loader").classList.add("hidden");
}

</script>

</body>
</html>
